# ========================
# PostgreSQL (production)
# ========================
# Override these values via environment variables in production:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/equipment_management_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:equipment_admin}
spring.datasource.password=${DB_PASSWORD:equipment_pass}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
